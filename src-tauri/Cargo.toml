[package]
name = "relay"
version = "0.7.0"
description = "Relay: a chat client for local and OpenAI-compatible models."
edition = "2021"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
anyhow = "1"
rand = "0.9"
base64 = "0.22"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_Xps", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Time"] }
